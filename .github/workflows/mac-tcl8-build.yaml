name: Mac tcl8 build and install

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew reinstall tcl-tk@8
        brew install autoconf
        brew install automake
        brew install cppunit
        brew install pkgconfig
        brew install libtool
        brew install openssl
        brew install mvn
        echo "@ FETCHING APACHE ZOOKEEPER"
        git clone https://github.com/apache/zookeeper.git
        cd zookeeper
        echo "@ Looking for MAX_PASSWORD_LEN pass 1"
        grep -r MAX_PASSWORD_LEN *
        echo "@ PATCHING APACHE ZOOKEEPER MAX_PASSWORD_LEN"
        sed -i "" '/const size_t MAX_PASSWORD_LEN = \(.*\);/s//#define MAX_PASSWORD_LEN (\1)/' zookeeper-client/zookeeper-client-c/src/zk_sasl.c
        echo "@ COMPILING APACHE ZOOKEEPER-JUTE"
        mvn -pl zookeeper-jute compile
        echo "@ CONFIGURING C-CLIENT"
        cd zookeeper-client/zookeeper-client-c/
        autoreconf -vi
        ./configure
        echo "@ Looking for MAX_PASSWORD_LEN pass 2"
        grep -r MAX_PASSWORD_LEN *
        echo "@ PATCHING APACHE ZOOKEEPER MAX_PASSWORD_LEN AGAIN"
        sed -i "" '/const size_t MAX_PASSWORD_LEN = \(.*\);/s//#define MAX_PASSWORD_LEN (\1)/' src/zk_sasl.c
        make
        sudo make install
    - name: configure
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@8
        ./configure --with-tcl=$PREFIX/lib --prefix=$PREFIX
    - name: make
      run: make
    - name: install
      run: sudo make install
