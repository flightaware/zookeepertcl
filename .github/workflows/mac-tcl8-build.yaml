name: Mac tcl8 build and install

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew reinstall tcl-tk@8
        brew install zookeeper
        brew install autoconf
        brew install automake
        brew install cppunit
        brew install pkgconfig
        brew install libtool
        brew install openssl
        brew install mvn
        git clone https://github.com/apache/zookeeper.git
        cd zookeeper
        mvn -pl zookeeper-jute compile
        cd zookeeper-client/zookeeper-client-c/
        autoreconf -vi
        ./configure
        sed -i "" '/const size_t MAX_PASSWORD_LEN = 1023;/s//#define MAX_PASSWORD_LEN 1023/' src/zk_sasl.c
        make
        sudo make install
    - name: configure
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@8
        ./configure --with-tcl=$PREFIX/lib --prefix=$PREFIX
    - name: make
      run: make
    - name: install
      run: sudo make install
